<svg style="display:none"></svg>
<div id="app"></div>

<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c2230; --line:#222a35;
    --ink:#e6edf3; --muted:#8b97a7; --dim:#5b6675;
    --gold:#e0a64a; --gold-soft:#3a2f17;
    --adv:#34c98a; --dec:#ef5f6b; --blue:#5aa9e6;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:transparent}
  #app{font-family:var(--sans);color:var(--ink);background:var(--bg);
    min-height:100%;padding:clamp(14px,3vw,30px);line-height:1.4}
  .wrap{max-width:1180px;margin:0 auto}

  /* header */
  .top{display:flex;justify-content:space-between;align-items:flex-end;
    gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);
    padding-bottom:16px;margin-bottom:22px}
  .brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold)}
  .brand h1{font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:-.02em;
    margin-top:4px}
  .brand h1 span{color:var(--dim);font-weight:500}
  .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .src{font-family:var(--mono);font-size:11px;color:var(--muted);
    padding:6px 10px;border:1px solid var(--line);border-radius:6px;
    display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .dot.live{background:var(--adv)}
  button{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    padding:8px 14px;border-radius:6px;transition:.15s}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.primary{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  button.primary:hover{filter:brightness(1.08);color:#1a1206}

  /* winner banner */
  .winner{background:linear-gradient(135deg,var(--panel) 0%,var(--gold-soft) 220%);
    border:1px solid #2e2920;border-radius:12px;padding:clamp(18px,2.6vw,28px);
    margin-bottom:22px;position:relative;overflow:hidden}
  .winner::before{content:"";position:absolute;inset:0;
    background:radial-gradient(600px 200px at 88% -40%,rgba(224,166,74,.16),transparent)}
  .winner .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold);position:relative}
  .winner .name{font-size:clamp(26px,5vw,46px);font-weight:700;
    letter-spacing:-.02em;margin:6px 0 16px;position:relative}
  .wstats{display:flex;gap:clamp(20px,5vw,52px);flex-wrap:wrap;position:relative}
  .wstat .k{font-family:var(--mono);font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em}
  .wstat .v{font-family:var(--mono);font-size:clamp(20px,3vw,28px);font-weight:700;
    margin-top:3px}
  .v.pos{color:var(--adv)} .v.neg{color:var(--dec)}
  .lists{display:grid;grid-template-columns:1fr 1fr;gap:14px;
    margin-top:18px;position:relative}
  .lists .col{background:rgba(0,0,0,.22);border:1px solid var(--line);
    border-radius:8px;padding:12px 14px}
  .lists .col .h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;margin-bottom:8px}
  .lists .col.up .h{color:var(--adv)} .lists .col.down .h{color:var(--dec)}
  .chip{display:inline-block;font-family:var(--mono);font-size:12px;
    padding:3px 8px;margin:2px 4px 2px 0;border-radius:5px;
    background:var(--panel-2);border:1px solid var(--line)}

  /* grid */
  .grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-bottom:18px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.lists{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px}
  .card h2{font-size:13px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);margin-bottom:14px;
    display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:3px;height:13px;background:var(--gold);
    border-radius:2px}

  /* ranking table */
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
  th{text-align:right;font-weight:500;color:var(--dim);font-size:10px;
    text-transform:uppercase;letter-spacing:.08em;padding:0 8px 9px;
    border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:center;width:34px}
  th.l,td.l{text-align:left}
  td{padding:9px 8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  tr.row:hover td{background:var(--panel-2)}
  tr.win td{background:rgba(224,166,74,.07)}
  .rk{color:var(--dim)} tr.win .rk{color:var(--gold);font-weight:700}
  .sec{font-family:var(--sans);font-weight:500}
  .ret.pos{color:var(--adv)} .ret.neg{color:var(--dec)}
  /* breadth bar inside cell */
  .bcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .btrack{width:46px;height:6px;border-radius:3px;background:var(--panel-2);
    overflow:hidden}
  .bfill{height:100%;background:var(--blue)}

  /* mini bars */
  .barlist{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:96px 1fr 56px;align-items:center;gap:10px}
  .bar .nm{font-family:var(--sans);font-size:12px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .tr{height:18px;background:var(--panel-2);border-radius:4px;position:relative}
  .bar .fl{position:absolute;top:0;bottom:0;border-radius:4px}
  .bar .fl.pos{background:var(--adv);left:50%}
  .bar .fl.neg{background:var(--dec);right:50%}
  .bar .vl{font-family:var(--mono);font-size:12px;text-align:right}
  .bar .vl.pos{color:var(--adv)} .bar .vl.neg{color:var(--dec)}
  .axis0{position:absolute;left:50%;top:0;bottom:0;width:1px;
    background:var(--dim);opacity:.4}

  /* heat row */
  .heat{display:flex;flex-wrap:wrap;gap:6px}
  .hcell{flex:1 1 84px;min-width:84px;border-radius:7px;padding:10px;
    border:1px solid var(--line)}
  .hcell .hn{font-size:11px;font-weight:600;line-height:1.2}
  .hcell .hv{font-family:var(--mono);font-size:14px;font-weight:700;margin-top:5px}

  /* distribution */
  .dist{display:flex;align-items:flex-end;gap:3px;height:120px;
    padding-top:10px}
  .dist .db{flex:1;border-radius:3px 3px 0 0;min-height:2px;transition:.2s}
  .distx{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;color:var(--dim);margin-top:6px}

  /* history */
  .hist-empty{font-family:var(--mono);font-size:12px;color:var(--dim);
    padding:8px 0}
  .htag{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);
    font-size:12px;padding:6px 10px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:6px;margin:3px}
  .htag b{color:var(--gold)}

  .foot{font-family:var(--mono);font-size:11px;color:var(--dim);
    text-align:center;margin-top:24px;border-top:1px solid var(--line);
    padding-top:16px;line-height:1.7}
  .foot a{color:var(--muted)}
  input[type=file]{display:none}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const fmt = n => (n>=0?'+':'')+n.toFixed(2)+'%';
const SECTORS = {
  "Information Technology":["TCS","INFY","WIPRO","HCLTECH","TECHM","LTIM","PERSISTENT","COFORGE","MPHASIS"],
  "Banking":["HDFCBANK","ICICIBANK","SBIN","AXISBANK","KOTAKBANK","INDUSINDBK","FEDERALBNK","IDFCFIRSTB"],
  "Pharma":["SUNPHARMA","DRREDDY","CIPLA","DIVISLAB","LUPIN","AUROPHARMA","BIOCON"],
  "Auto":["MARUTI","TATAMOTORS","M&M","BAJAJ-AUTO","EICHERMOT","HEROMOTOCO","TVSMOTOR"],
  "FMCG":["HINDUNILVR","ITC","NESTLEIND","BRITANNIA","DABUR","MARICO","GODREJCP"],
  "Capital Goods":["LT","SIEMENS","ABB","BHEL","CUMMINSIND","THERMAX","BEL"],
  "Realty":["DLF","GODREJPROP","OBEROIRLTY","PRESTIGE","PHOENIXLTD"],
  "Metals":["TATASTEEL","JSWSTEEL","HINDALCO","VEDL","JINDALSTEL","NMDC","SAIL"],
  "Energy":["RELIANCE","ONGC","NTPC","POWERGRID","COALINDIA","BPCL","IOC","GAIL"]
};

// ---- data state -----------------------------------------------------------
let HISTORY = [];          // {week, sector, ret}
let SOURCE  = 'demo';

function lastFriday(){
  const d=new Date(); const off=(d.getDay()-5+7)%7;
  d.setDate(d.getDate()-off);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

// seeded RNG so demo is stable within a session-ish window
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genDemo(seed){
  const rnd=mulberry32(seed); const stocks=[];
  for(const [sec,syms] of Object.entries(SECTORS)){
    for(const s of syms){
      const r=(rnd()*16-7); // -7..+9 ish
      stocks.push({symbol:s,sector:sec,ret:Math.round(r*100)/100});
    }
  }
  return stocks;
}

// ---- aggregation ----------------------------------------------------------
function aggregate(stocks){
  const map={};
  stocks.forEach(s=>{(map[s.sector]??=[]).push(s)});
  const rows=Object.entries(map).map(([sec,arr])=>{
    const rets=arr.map(a=>a.ret).sort((x,y)=>x-y);
    const avg=rets.reduce((a,b)=>a+b,0)/rets.length;
    const med=rets.length%2?rets[(rets.length-1)/2]:(rets[rets.length/2-1]+rets[rets.length/2])/2;
    const adv=arr.filter(a=>a.ret>0).length;
    return{sector:sec,avg:+avg.toFixed(2),med:+med.toFixed(2),adv,
      dec:arr.filter(a=>a.ret<0).length,total:arr.length,
      breadth:+(adv/arr.length*100).toFixed(1)};
  }).filter(r=>r.total>=3).sort((a,b)=>b.avg-a.avg);
  rows.forEach((r,i)=>r.rank=i+1);
  return rows;
}
function topBottom(stocks,sector,n=5){
  const sub=stocks.filter(s=>s.sector===sector).sort((a,b)=>b.ret-a.ret);
  return{top:sub.slice(0,n),bottom:sub.slice(-n).reverse()};
}
const heatColor = v => {
  const c=Math.max(-6,Math.min(6,v))/6;
  return c>=0
    ? `rgba(52,201,138,${.10+c*.42})`
    : `rgba(239,95,107,${.10+(-c)*.42})`;
};

// ---- render ---------------------------------------------------------------
function render(stocks){
  const rank=aggregate(stocks);
  const win=rank[0];
  const {top,bottom}=topBottom(stocks,win.sector);
  const week=lastFriday();

  // distribution buckets (-10..+10, 1% bins)
  const bins=new Array(20).fill(0);
  stocks.forEach(s=>{const i=Math.max(0,Math.min(19,Math.floor((s.ret+10))));bins[i]++});
  const maxBin=Math.max(...bins,1);
  const maxAbsAvg=Math.max(...rank.map(r=>Math.abs(r.avg)),1);

  $('#app').innerHTML=`<div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="eyebrow">NIFTY 500 · Weekly Rotation</div>
        <h1>Sector of the Week <span>/ ${week}</span></h1>
      </div>
      <div class="ctrls">
        <div class="src"><span class="dot ${SOURCE==='csv'?'live':''}"></span>${SOURCE==='csv'?'Your CSV':'Demo data'}</div>
        <button id="reroll">Reshuffle demo</button>
        <button class="primary" id="upload">Upload CSV</button>
        <input type="file" id="file" accept=".csv,text/csv">
      </div>
    </div>

    <div class="winner">
      <div class="lbl">🏆 Sector of the Week</div>
      <div class="name">${win.sector}</div>
      <div class="wstats">
        <div class="wstat"><div class="k">Avg Return</div><div class="v ${win.avg>=0?'pos':'neg'}">${fmt(win.avg)}</div></div>
        <div class="wstat"><div class="k">Breadth</div><div class="v">${win.breadth}%</div></div>
        <div class="wstat"><div class="k">Advances</div><div class="v pos">${win.adv}</div></div>
        <div class="wstat"><div class="k">Declines</div><div class="v neg">${win.dec}</div></div>
        <div class="wstat"><div class="k">Constituents</div><div class="v">${win.total}</div></div>
      </div>
      <div class="lists">
        <div class="col up"><div class="h">▲ Top performers</div>
          ${top.map(s=>`<span class="chip">${s.symbol} ${fmt(s.ret)}</span>`).join('')}</div>
        <div class="col down"><div class="h">▼ Laggards</div>
          ${bottom.map(s=>`<span class="chip">${s.symbol} ${fmt(s.ret)}</span>`).join('')}</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Sector Rankings</h2>
        <table><thead><tr>
          <th>#</th><th class="l">Sector</th><th>Avg</th><th>Median</th>
          <th>Adv/Dec</th><th>Breadth</th><th>Stocks</th>
        </tr></thead><tbody>
        ${rank.map(r=>`<tr class="row ${r.rank===1?'win':''}">
          <td class="rk">${r.rank}</td>
          <td class="l sec">${r.sector}</td>
          <td class="ret ${r.avg>=0?'pos':'neg'}">${fmt(r.avg)}</td>
          <td class="ret ${r.med>=0?'pos':'neg'}">${fmt(r.med)}</td>
          <td>${r.adv}/${r.dec}</td>
          <td><div class="bcell">${r.breadth}%<div class="btrack"><div class="bfill" style="width:${r.breadth}%"></div></div></div></td>
          <td>${r.total}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>

      <div class="card">
        <h2>Average Weekly Return</h2>
        <div class="barlist">
          ${rank.map(r=>`<div class="bar">
            <div class="nm">${r.sector}</div>
            <div class="tr"><div class="axis0"></div>
              <div class="fl ${r.avg>=0?'pos':'neg'}" style="width:${Math.abs(r.avg)/maxAbsAvg*50}%"></div>
            </div>
            <div class="vl ${r.avg>=0?'pos':'neg'}">${fmt(r.avg)}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <h2>Sector Heatmap · avg return</h2>
      <div class="heat">
        ${rank.map(r=>`<div class="hcell" style="background:${heatColor(r.avg)}">
          <div class="hn">${r.sector}</div>
          <div class="hv ${r.avg>=0?'ret pos':'ret neg'}">${fmt(r.avg)}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Weekly Return Distribution · all stocks</h2>
        <div class="dist">
          ${bins.map((b,i)=>`<div class="db" style="height:${b/maxBin*100}%;
            background:${i<10?'var(--dec)':'var(--adv)'};opacity:${.35+b/maxBin*.65}"></div>`).join('')}
        </div>
        <div class="distx"><span>−10%</span><span>0%</span><span>+10%</span></div>
      </div>
      <div class="card">
        <h2>Historical Winners</h2>
        <div id="histbox">
          ${HISTORY.length
            ? HISTORY.slice().reverse().map(h=>`<span class="htag"><b>${h.sector}</b> ${fmt(h.ret)} · ${h.week}</span>`).join('')
            : `<div class="hist-empty">No history yet. Each reshuffle or CSV upload logs a winner here for this session.</div>`}
        </div>
      </div>
    </div>

    <div class="foot">
      Browser dashboards can't reach Yahoo/NSE directly — this runs on demo data or your uploaded CSV.<br>
      CSV format: <b>symbol,sector,weekly_return</b> (one row per stock). For automated Friday runs, use the Python project.
    </div>
  </div>`;

  $('#reroll').onclick=()=>{
    logHistory(win,week);
    SOURCE='demo';
    render(genDemo(Math.floor(Math.random()*1e6)));
  };
  $('#upload').onclick=()=>$('#file').click();
  $('#file').onchange=onFile;
}

let lastLoggedWeek=null;
function logHistory(win,week){
  // log the winner currently on screen before changing data
  if(lastLoggedWeek!==win.sector+week){
    HISTORY.push({week,sector:win.sector,ret:win.avg});
    if(HISTORY.length>12) HISTORY.shift();
    lastLoggedWeek=win.sector+week;
  }
}

function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const stocks=parseCSV(ev.target.result);
      if(!stocks.length) throw new Error('No valid rows');
      SOURCE='csv'; render(stocks);
    }catch(err){ alert('Could not read CSV: '+err.message+
      '\nExpected columns: symbol, sector, weekly_return'); }
  };
  rd.readAsText(f);
}
function parseCSV(txt){
  const lines=txt.trim().split(/\r?\n/);
  const head=lines[0].toLowerCase().split(',').map(s=>s.trim());
  const iS=head.findIndex(h=>h.includes('symbol'));
  const iSec=head.findIndex(h=>h.includes('sector'));
  const iR=head.findIndex(h=>h.includes('return')||h.includes('change'));
  if(iS<0||iSec<0||iR<0) throw new Error('missing required columns');
  const out=[];
  for(let k=1;k<lines.length;k++){
    const c=lines[k].split(',');
    const r=parseFloat(c[iR]);
    if(c[iS]&&c[iSec]&&!isNaN(r))
      out.push({symbol:c[iS].trim(),sector:c[iSec].trim(),ret:Math.round(r*100)/100});
  }
  return out;
}

render(genDemo(42));
</script>
