<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mirae Asset Large Cap Fund — Positioning Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070B; --card:#0C1118; --card2:#0E141C;
    --border:rgba(255,255,255,0.07); --borderStrong:rgba(255,255,255,0.14);
    --accent:#F2732B; --accentDim:rgba(242,115,43,0.14); --accentLine:rgba(242,115,43,0.35);
    --blue:#4C8DFF; --blueDim:rgba(76,141,255,0.14);
    --green:#34D399; --greenDim:rgba(52,211,153,0.14);
    --red:#F2545B;
    --white:#F3F5F8; --grey:#8A93A3; --greyDim:#565E6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px;}
  button{font-family:inherit;background:none;border:none;color:inherit;cursor:pointer;}
  a{color:inherit;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}

  .wrap{max-width:1360px;margin:0 auto;padding:0 28px 80px;}

  /* top bar */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;
    border-bottom:1px solid var(--border);margin-bottom:28px;font-size:11.5px;color:var(--grey);}
  .topbar .left, .topbar .right{display:flex;gap:18px;align-items:center;}
  .live-dot{width:6px;height:6px;border-radius:99px;background:var(--green);display:inline-block;margin-right:5px;}

  /* hero */
  .hero{display:grid;grid-template-columns:1fr 1.3fr;gap:32px;align-items:start;margin-bottom:28px;}
  .hero h1{font-size:30px;margin:0 0 6px;letter-spacing:-0.01em;font-weight:650;}
  .hero .amc{color:var(--grey);font-size:13.5px;margin-bottom:16px;}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .mandate{font-size:12.5px;color:var(--greyDim);line-height:1.6;max-width:420px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
    border-radius:14px;overflow:hidden;border:1px solid var(--border);}
  .kpi{background:var(--card);padding:18px 16px;}
  .kpi .l{font-size:10px;color:var(--greyDim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
  .kpi .v{font-size:16.5px;color:var(--white);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* eyebrow */
  .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--grey);
    font-size:11px;letter-spacing:0.16em;text-transform:uppercase;font-weight:600;}
  .eyebrow svg{flex-shrink:0;}

  /* card */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;
    transition:border-color .35s ease, transform .35s ease, box-shadow .35s ease;}
  .card:hover{border-color:var(--borderStrong);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .card.flat{padding:0;overflow:hidden;}
  .card.flat:hover{transform:none;box-shadow:none;}

  /* chip */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    padding:4px 10px;border-radius:999px;font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;
    background:rgba(255,255,255,0.05);color:var(--grey);border:1px solid var(--border);}
  .chip.accent{background:var(--accentDim);color:var(--accent);border-color:var(--accentLine);}
  .chip.green{background:var(--greenDim);color:var(--green);border-color:rgba(52,211,153,.3);}
  .chip.blue{background:var(--blueDim);color:var(--blue);border-color:rgba(76,141,255,.3);}

  .delta{display:inline-flex;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;
    font-size:12.5px;font-weight:600;}

  /* grids */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  .grid-compass{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-bottom:20px;}
  .grid-radar{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;margin-bottom:20px;}
  .section{margin-bottom:32px;}
  .section-tight{margin-bottom:20px;}

  @media (max-width: 860px){
    .hero,.grid-2,.grid-compass,.grid-radar{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* signature */
  .sig-head{padding:22px 26px 0;}
  .sig-head-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;}
  .sig-desc{color:var(--grey);font-size:13px;max-width:520px;line-height:1.5;}
  .sig-strip{display:flex;border-top:1px solid var(--border);}
  .sig-cell{flex:1;padding:12px 8px;text-align:center;border-left:1px solid var(--border);}
  .sig-cell:first-child{border-left:none;}
  .sig-cell .v{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--white);font-weight:600;}
  .sig-cell .l{font-size:9.5px;color:var(--greyDim);margin-top:2px;letter-spacing:0.03em;}

  /* compass */
  .compass-body{display:flex;gap:24px;flex-wrap:wrap;}
  .compass-side{flex:1;min-width:220px;}
  .qbtn-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .qbtn{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:6px 10px;border-radius:8px;
    cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--grey);transition:all .2s ease;}
  .qbtn.active{border-color:var(--accentLine);background:var(--accentDim);color:var(--accent);}
  .label-sm{font-size:12px;color:var(--greyDim);margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase;}
  .ai-note{color:var(--white);font-size:14.5px;line-height:1.6;margin:0;}
  .axis-row{margin-top:16px;display:flex;gap:20px;}
  .axis-label{font-size:10.5px;color:var(--greyDim);text-transform:uppercase;letter-spacing:0.05em;}
  .axis-val{font-family:'JetBrains Mono',monospace;color:var(--white);font-size:15px;}

  /* dna */
  .dna-row{margin-bottom:14px;}
  .dna-top{display:flex;justify-content:space-between;margin-bottom:5px;}
  .dna-name{font-size:12.5px;color:var(--white);font-weight:500;}
  .dna-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grey);}
  .dna-segs{display:flex;gap:2px;}
  .dna-seg{height:7px;flex:1;border-radius:1.5px;background:rgba(255,255,255,0.06);transition:background .5s ease;}
  .dna-note{font-size:11.5px;color:var(--greyDim);margin-top:5px;line-height:1.4;display:none;}
  .dna-row:hover .dna-note{display:block;}
  .dna-row:hover .dna-segs{opacity:1;}

  /* fingerprint */
  .fp-body{display:flex;gap:24px;flex-wrap:wrap;align-items:center;}
  .fp-side{flex:1;min-width:220px;}
  .fp-default{color:var(--grey);font-size:13.5px;line-height:1.6;margin:0;}
  .fp-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .fp-legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--grey);cursor:pointer;}
  .fp-legend i{width:7px;height:7px;border-radius:99px;display:inline-block;}

  /* mirror */
  .mirror-legend{display:flex;gap:16px;font-size:11px;color:var(--grey);margin-bottom:16px;}
  .mirror-legend span{display:flex;align-items:center;gap:5px;}
  .mirror-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .mirror-row{margin-bottom:12px;}
  .mirror-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .mirror-vals{font-family:'JetBrains Mono',monospace;color:var(--greyDim);font-size:11.5px;}
  .mirror-track{position:relative;height:14px;}
  .mirror-bench{position:absolute;top:3px;left:0;height:3px;border-radius:2px;background:var(--grey);opacity:.5;width:0;transition:width 1s ease;}
  .mirror-fund{position:absolute;top:8px;left:0;height:4px;border-radius:2px;background:var(--accent);width:0;transition:width 1s ease .1s;}

  /* treemap */
  .treemap{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:18px;}
  .tblock{height:74px;border-radius:8px;cursor:pointer;padding:10px 12px;background:var(--card2);
    border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;
    transition:all .25s ease;min-width:90px;}
  .tblock.open{background:var(--accentDim);border-color:var(--accentLine);}
  .tblock .name{font-size:11.5px;color:var(--white);font-weight:600;line-height:1.25;}
  .tblock.open .name{color:var(--accent);}
  .tblock .bottom{display:flex;justify-content:space-between;align-items:flex-end;}
  .tblock .wt{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--white);font-weight:600;}
  .sector-detail{border-top:1px solid var(--border);padding-top:14px;}
  .sector-detail .lbl{font-size:11px;color:var(--greyDim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;}
  .sector-chips{display:flex;flex-wrap:wrap;gap:8px;}

  /* holdings table */
  th{text-align:right;padding:10px 20px;border-bottom:1px solid var(--border);font-weight:600;
    color:var(--greyDim);text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;}
  th:first-child{text-align:left;}
  td{padding:10px 20px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  td.name{color:var(--white);font-weight:500;}
  td.right{text-align:right;}
  td.grey{color:var(--grey);}

  /* radar */
  .radar-legend{display:flex;gap:16px;font-size:11px;color:var(--grey);justify-content:center;margin-top:10px;}
  .radar-legend span{display:flex;align-items:center;gap:5px;}
  .radar-legend i{width:8px;height:8px;border-radius:99px;display:inline-block;}

  /* evolution */
  .evo-scroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;}
  .evo-card{min-width:250px;flex:0 0 auto;padding:16px;border-radius:10px;background:var(--card2);
    border:1px solid var(--border);position:relative;}
  .evo-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .evo-dot{width:8px;height:8px;border-radius:99px;background:var(--grey);}
  .evo-dot.current{background:var(--accent);}
  .evo-q{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--grey);}
  .evo-headline{color:var(--white);font-weight:600;font-size:13.5px;margin-bottom:8px;}
  .evo-change{color:var(--grey);font-size:12px;line-height:1.5;margin-bottom:10px;}
  .evo-ai{border-top:1px solid var(--border);padding-top:8px;display:flex;gap:6px;color:var(--greyDim);
    font-size:11.5px;line-height:1.45;}
  .evo-ai svg{flex-shrink:0;margin-top:2px;}

  /* insights */
  .insights-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
  .insight-card{display:flex;flex-direction:column;gap:10px;}
  .insight-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .insight-title{color:var(--white);font-weight:600;font-size:14px;max-width:75%;}
  .insight-body{color:var(--grey);font-size:12.5px;line-height:1.55;margin:0;}
  .insight-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--greyDim);margin-top:4px;}
  .insight-meta b{color:var(--white);}
  .insight-evidence{font-size:10.5px;color:var(--greyDim);border-top:1px solid var(--border);padding-top:8px;
    display:flex;gap:5px;align-items:flex-start;}
  .insight-evidence svg{flex-shrink:0;margin-top:2px;}

  /* performance */
  .perf-grid1{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
  .perf-grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;}
  @media (max-width:860px){.perf-grid1,.perf-grid2{grid-template-columns:1fr;}}
  .perf-label{font-size:12px;color:var(--grey);margin-bottom:10px;}
  .returns-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .returns-k{font-size:12.5px;color:var(--grey);}
  .returns-v{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--white);font-weight:600;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .stat-k{font-size:10.5px;color:var(--greyDim);text-transform:uppercase;letter-spacing:.04em;}
  .stat-v{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--white);font-weight:600;}

  /* summary */
  .summary-brief{margin-bottom:14px;}
  .summary-brief .lbl{font-size:11px;color:var(--greyDim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .summary-brief p{color:var(--white);font-size:15px;line-height:1.7;margin:0;}
  .summary-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  @media (max-width:860px){.summary-cols{grid-template-columns:1fr;}}
  .summary-cols .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;font-weight:700;}
  .summary-cols ul{margin:0;padding-left:18px;color:var(--grey);font-size:13px;line-height:1.7;}
  .summary-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  .summary-blocks .lbl{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:8px;font-weight:700;}
  .summary-blocks p{color:var(--grey);font-size:12.8px;line-height:1.6;margin:0;}

  .footer-note{border-top:1px solid var(--border);padding-top:20px;font-size:11px;color:var(--greyDim);line-height:1.6;}

  /* ===== institutional modules ===== */
  .badge-conv{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12.5px;background:var(--accentDim);color:var(--accent);border:1px solid var(--accentLine);}
  .exh-row{display:grid;grid-template-columns:1.6fr .7fr .9fr 1.9fr .8fr;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--border);}
  .exh-row:last-child{border-bottom:none;}
  .exh-head{font-size:10px;color:var(--greyDim);text-transform:uppercase;letter-spacing:.06em;padding:0 4px 10px;border-bottom:1px solid var(--border);}
  .exh-head-row{display:grid;grid-template-columns:1.6fr .7fr .9fr 1.9fr .8fr;gap:14px;}
  @media(max-width:860px){.exh-row,.exh-head-row{grid-template-columns:1fr;}}
  .exh-name{color:var(--white);font-weight:600;font-size:13.5px;}
  .exh-why{color:var(--grey);font-size:12px;line-height:1.5;}
  .exh-sub{color:var(--greyDim);font-size:11px;margin-top:2px;}

  .peer-scroll{overflow-x:auto;}
  .peer-table{min-width:1180px;}
  .peer-table th{white-space:nowrap;font-size:10px;}
  .peer-table td{white-space:nowrap;font-size:12px;}
  .peer-table tr.self td{background:var(--accentDim);}
  .peer-table tr.self td.name{color:var(--accent);font-weight:700;}
  .peer-table td.best{color:var(--green);font-weight:700;}
  .peer-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}

  .rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .rank-tile{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
  .rank-tile .big{font-family:'JetBrains Mono',monospace;font-size:21px;color:var(--accent);font-weight:700;}
  .rank-tile .lbl2{font-size:10.5px;color:var(--greyDim);text-transform:uppercase;letter-spacing:.05em;margin-top:6px;}
  .rank-bars{display:flex;flex-direction:column;gap:12px;}
  .rank-bar-row{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:10px;}
  .rank-bar-k{font-size:12px;color:var(--grey);}
  .rank-bar-track{position:relative;height:8px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
  .rank-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--blue));width:0;transition:width 1s ease;}
  .rank-bar-v{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--white);text-align:right;}

  .calc-amt-row,.calc-dur-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:860px){.calc-grid{grid-template-columns:1fr;}}
  .calc-results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .calc-result{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .calc-result .k{font-size:10.5px;color:var(--greyDim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .calc-result .v{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--white);font-weight:700;}
  .calc-result.hi .v{color:var(--accent);}
  .calc-note{font-size:11.5px;color:var(--greyDim);margin-top:12px;line-height:1.6;}

  .svl-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;}
  @media(max-width:860px){.svl-grid{grid-template-columns:1fr;}}
  .svl-col{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .svl-col .lbl2{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:10px;}
  .svl-row{display:flex;justify-content:space-between;font-size:12px;color:var(--grey);margin-bottom:8px;}
  .svl-row b{color:var(--white);font-family:'JetBrains Mono',monospace;font-weight:600;}

  .rr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .rr-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .rr-card .per{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700;font-size:13px;margin-bottom:10px;}
  .rr-stat{display:flex;justify-content:space-between;font-size:11.5px;color:var(--grey);padding:3px 0;}
  .rr-stat b{color:var(--white);font-family:'JetBrains Mono',monospace;}

  .overlap-row{display:grid;grid-template-columns:1.3fr 2fr .7fr;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);}
  .overlap-row:last-child{border-bottom:none;}
  .overlap-name{font-size:12.5px;color:var(--white);}
  .overlap-track{position:relative;height:8px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
  .overlap-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--blue);width:0;transition:width 1s ease;}
  .overlap-pct{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--white);text-align:right;}

  .evo-lists{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:11px;}
  .evo-lists div{color:var(--greyDim);}
  .evo-lists b{color:var(--grey);display:block;margin-bottom:3px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;}
  .tag-add{color:var(--green);}.tag-rem{color:var(--red);}

  /* ===== OS shell ===== */
  .os-banner{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;margin-bottom:20px;
    background:linear-gradient(90deg,var(--accentDim),transparent);border:1px solid var(--accentLine);}
  .os-banner .dot{width:7px;height:7px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulseDot 2s infinite;}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(242,115,43,.5);}70%{box-shadow:0 0 0 8px rgba(242,115,43,0);}100%{box-shadow:0 0 0 0 rgba(242,115,43,0);}}
  .os-banner span{font-size:12px;color:var(--grey);}
  .os-banner b{color:var(--white);}

  /* ===== Fund Brain ===== */
  .brain-wrap{display:flex;gap:20px;flex-wrap:wrap;}
  .brain-svg{flex:1.5;min-width:340px;}
  .brain-side{flex:1;min-width:260px;}
  .brain-node{cursor:pointer;transition:opacity .3s ease;}
  .brain-node circle{transition:r .25s ease, stroke-width .25s ease;}
  .brain-node text{font-size:9.5px;fill:var(--grey);pointer-events:none;}
  .brain-edge{stroke-dasharray:4 3;transition:opacity .3s ease, stroke-width .3s ease;}
  .brain-tier-lbl{font-size:9px;fill:var(--greyDim);letter-spacing:.12em;text-transform:uppercase;}
  .brain-default{color:var(--grey);font-size:13.5px;line-height:1.6;margin:0;}

  .orbit-slow{animation:orbitspin 90s linear infinite;}
  .orbit-mid{animation:orbitspin 60s linear infinite reverse;}
  .orbit-fast{animation:orbitspin 40s linear infinite;}
  @keyframes orbitspin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .galaxy-star{cursor:pointer;}
  .galaxy-star circle{transition:r .2s ease;}
  .galaxy-star:hover circle{filter:brightness(1.3);}
  .galaxy-counter-rot{transform-origin:center;}
  .galaxy-side{flex:1;min-width:240px;}

  /* ===== Capital Flow River ===== */
  .river-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--grey);margin-top:12px;}
  .river-legend span{display:flex;align-items:center;gap:5px;}
  .river-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .river-flow{stroke-dasharray:6 5;animation:riverdash 2.4s linear infinite;}
  @keyframes riverdash{to{stroke-dashoffset:-44;}}

  /* ===== What-If Lab ===== */
  .lab-scenario-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .lab-slider-row{margin-bottom:16px;}

  .lab-slider-val{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700;font-size:13px;}

  .vital-bar i{display:block;height:100%;border-radius:3px;}

  .replay-controls{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .replay-play{width:34px;height:34px;border-radius:99px;background:var(--accentDim);border:1px solid var(--accentLine);

  .replay-fill{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;}

/* ============================================================
   FUND PULSE — composite health index (from DNA)
============================================================ */
function computeHealthIndex(){
  const w = {Quality:.22, Risk:.12, Diversification:.16, Cash:.10, Stability:.18, Momentum:.10, Liquidity:.12};
  let score = 0, wsum=0;
  DNA.forEach(d=>{ if(w[d.key]!==undefined){ score += d.value*w[d.key]; wsum += w[d.key]; }});
  return Math.round(score/wsum);
}

function fmtINR(n){ return "₹" + Math.round(n).toLocaleString("en-IN"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function deltaHtml(v, suffix){
  suffix = suffix===undefined ? "pp" : suffix;
  const up = v>0, flat = v===0;
  const color = flat?T.grey:(up?T.green:T.red);
  const ic = flat?"minus":(up?"up":"down");
  const sign = up ? "+" : "";
  return `<span class="delta" style="color:${color}">${icon(ic,12,color)}${sign}${v.toFixed(2)}${suffix}</span>`;
}
function chip(text, tone){ return `<span class="chip ${tone||""}">${text}</span>`; }

/* ============================================================
   SECTION: POSITIONING SIGNATURE
============================================================ */
function renderSignature(){
  const seeds = [82,58,71,54,63,91,68,24,76,46];
  const labels = ["Sector Alloc.","Market Cap","Risk","Quality","Growth","Value","Momentum","Cash","Diversification","Conviction"];
  const N = 140, w=1200, h=200, mid=h/2;
  let pts = [];
  for(let i=0;i<N;i++){
    const t=i/(N-1); let y=0;
    seeds.forEach((s,idx)=>{
      const freq=1.5+idx*0.9, amp=(s/100)*(9-idx*0.5);
      y += Math.sin(t*Math.PI*freq+idx)*amp;
    });
    pts.push(y);
  }
  const path = pts.map((y,i)=>`${i===0?"M":"L"} ${(i/(pts.length-1))*w} ${mid-y*4.4}`).join(" ");
  const mirror = pts.map((y,i)=>`${i===0?"M":"L"} ${(i/(pts.length-1))*w} ${mid+y*4.4}`).join(" ");

  return `
  <div class="card flat">
    <div class="sig-head">
      ${eyebrow("Mutual Fund Positioning Signature","activity")}
      <div class="sig-head-row">
        <div class="sig-desc">A unique waveform generated from sector allocation, market-cap mix, risk, quality, growth, value, momentum, cash, diversification and conviction — no two funds render alike.</div>
        <div class="chiprow" style="margin-bottom:0;">${chip("Quality-led","accent")}${chip("Low cash","blue")}${chip("High conviction","green")}</div>
      </div>
    </div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:200px;display:block;margin-top:8px;">
      <defs>
        <linearGradient id="sigGradA" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${T.accent}" stop-opacity="0.9"/>
          <stop offset="50%" stop-color="${T.blue}" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="${T.green}" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="sigFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${T.accent}" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="${T.accent}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="0" y1="${mid}" x2="${w}" y2="${mid}" stroke="${T.border}" stroke-width="1"/>
      <path d="${path} L ${w} ${mid} L 0 ${mid} Z" fill="url(#sigFade)" opacity="0.5"/>
      <path d="${path}" fill="none" stroke="url(#sigGradA)" stroke-width="2">
        <animate attributeName="stroke-dasharray" from="0,4000" to="4000,0" dur="2.4s" fill="freeze"/>
      </path>
      <path d="${mirror}" fill="none" stroke="${T.blue}" stroke-width="1" opacity="0.35">
        <animate attributeName="stroke-dasharray" from="0,4000" to="4000,0" dur="2.8s" fill="freeze"/>
      </path>
    </svg>
    <div class="sig-strip">
      ${seeds.map((s,i)=>`<div class="sig-cell"><div class="v">${s}</div><div class="l">${labels[i]}</div></div>`).join("")}
    </div>
  </div>`;
}

/* ============================================================
   SECTION: FACTOR RADAR (custom SVG)
============================================================ */
function renderRadar(){
  const axes = FACTOR_RADAR.map(d=>d.axis);
  const N = axes.length;
  const size = 320, cx = size/2, cy = size/2 - 6, R = 118;
  const angle = i => (Math.PI*2*i/N) - Math.PI/2;
  const ptFor = (val, i) => {
    const r = (val/100)*R;
    return [cx + r*Math.cos(angle(i)), cy + r*Math.sin(angle(i))];
  };
  const gridRings = [0.25,0.5,0.75,1].map(f=>{
    const pts = axes.map((_,i)=>ptFor(f*100,i).join(",")).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="${T.border}" stroke-width="1"/>`;
  }).join("");
  const spokes = axes.map((a,i)=>{
    const [x,y] = ptFor(100,i);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${T.border}" stroke-width="1"/>`;
  }).join("");
  const labels = axes.map((a,i)=>{
    const [x,y] = ptFor(122,i);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" fill="${T.grey}">${a}</text>`;
  }).join("");
  function seriesPoly(key, color, fillOp, strokeW, dash){
    const pts = axes.map((a,i)=>{
      const row = FACTOR_RADAR[i];
      return ptFor(row[key], i).join(",");
    }).join(" ");
    return `<polygon points="${pts}" fill="${color}" fill-opacity="${fillOp}" stroke="${color}" stroke-width="${strokeW}" ${dash?`stroke-dasharray="${dash}"`:""}/>`;
  }
  return `
  <div class="card">
    ${eyebrow("Factor Radar","target")}
    <svg viewBox="0 0 ${size} ${size}" width="100%" height="300" style="display:block;margin:0 auto;">
      ${gridRings}${spokes}
      ${seriesPoly("Category",T.blue,0.05,1.2,"4 3")}
      ${seriesPoly("Benchmark",T.grey,0.06,1.4)}
      ${seriesPoly("Fund",T.accent,0.28,2)}
      ${labels}
    </svg>
    <div class="radar-legend">
      <span><i style="background:${T.accent}"></i>Fund</span>
      <span><i style="background:${T.grey}"></i>Benchmark</span>
      <span><i style="background:${T.blue}"></i>Category</span>
    </div>
  </div>`;
}

/* ============================================================
   SECTION: PERFORMANCE ANALYTICS (custom SVG line/area charts)
============================================================ */
function lineChartSvg(series, keys, colors, dash, h){
  h = h || 220;
  const w = 560, padL=34, padR=8, padT=10, padB=24;
  const allVals = series.flatMap(d=>keys.map(k=>d[k]));
  const minV = Math.min(...allVals)-2, maxV = Math.max(...allVals)+2;
  const xw = (w-padL-padR)/(series.length-1);
  const yFor = v => padT + (1-(v-minV)/(maxV-minV))*(h-padT-padB);
  const xFor = i => padL + i*xw;
  let grid = "";
  for(let g=0; g<4; g++){
    const y = padT + g*(h-padT-padB)/3;
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="${T.border}"/>`;
  }
  const axisLabels = series.map((d,i)=>`<text x="${xFor(i)}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="${T.greyDim}">${d.m}</text>`).join("");
  const lines = keys.map((k,ki)=>{
    const pts = series.map((d,i)=>`${xFor(i)},${yFor(d[k])}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${colors[ki]}" stroke-width="${ki===0?2.2:1.4}" ${dash[ki]?`stroke-dasharray="${dash[ki]}"`:""}/>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${grid}${lines}${axisLabels}</svg>`;
}

function areaChartSvg(series, key, color, h){
  h = h || 190;
  const w = 560, padL=30, padR=8, padT=10, padB=22;
  const vals = series.map(d=>d[key]);
  const minV = Math.min(...vals)-1, maxV = Math.max(1,Math.max(...vals)+1);
  const xw = (w-padL-padR)/(series.length-1);
  const yFor = v => padT + (1-(v-minV)/(maxV-minV))*(h-padT-padB);
  const xFor = i => padL + i*xw;
  const zeroY = yFor(0);
  const pts = series.map((d,i)=>`${xFor(i)},${yFor(d[key])}`).join(" ");
  const areaPath = `M ${xFor(0)},${zeroY} ` + series.map((d,i)=>`L ${xFor(i)},${yFor(d[key])}`).join(" ") + ` L ${xFor(series.length-1)},${zeroY} Z`;
  let grid = "";
  for(let g=0; g<4; g++){
    const y = padT + g*(h-padT-padB)/3;
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="${T.border}"/>`;
  }
  const axisLabels = series.filter((_,i)=>i%2===0).map(d=>{
    const i = series.indexOf(d);
    return `<text x="${xFor(i)}" y="${h-4}" text-anchor="middle" font-size="9" fill="${T.greyDim}">${d.m}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <defs><linearGradient id="ddFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${areaPath}" fill="url(#ddFill)"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8"/>
    ${axisLabels}
  </svg>`;
}

/* ============================================================
   SECTION: SIP ANALYSIS
============================================================ */
const ASSUMED_CAGR = RETURNS["5Y"]; // 12.63% — fund's trailing 5Y CAGR, used as the projection assumption
const INFLATION = 5.5;
const SIP_AMOUNTS = [500,1000,2000,5000,10000,25000,50000];
const DURATIONS = [1,3,5,7,10,15,20];
let sipAmount = 5000, sipYears = 10;
function sipFV(monthlyAmt, years, ratePct){
  const n = years*12, r = ratePct/100, i = Math.pow(1+r, 1/12)-1;
  if(i===0) return monthlyAmt*n;
  return monthlyAmt * ((Math.pow(1+i,n)-1)/i) * (1+i);
}
function renderSip(){
  const invested = sipAmount*sipYears*12;
  const fv = sipFV(sipAmount, sipYears, ASSUMED_CAGR);
  const profit = fv-invested;
  const realFv = fv/Math.pow(1+INFLATION/100, sipYears);
  return `
  <div class="card">
    ${eyebrow("SIP Analysis","bar")}
    <div class="label-sm">Monthly SIP Amount</div>
    <div class="calc-amt-row">${SIP_AMOUNTS.map(a=>`<button class="qbtn mono ${a===sipAmount?'active':''}" onclick="setSip(${a},null)">₹${a.toLocaleString("en-IN")}</button>`).join("")}</div>
    <div class="label-sm">Duration</div>
    <div class="calc-dur-row">${DURATIONS.map(y=>`<button class="qbtn mono ${y===sipYears?'active':''}" onclick="setSip(null,${y})">${y}Y</button>`).join("")}</div>
    <div class="calc-results">
      <div class="calc-result"><div class="k">Total Investment</div><div class="v">${fmtINR(invested)}</div></div>
      <div class="calc-result hi"><div class="k">Current Value (Projected)</div><div class="v">${fmtINR(fv)}</div></div>
      <div class="calc-result"><div class="k">Total Profit</div><div class="v" style="color:${T.green}">${fmtINR(profit)}</div></div>
      <div class="calc-result"><div class="k">Assumed CAGR / XIRR</div><div class="v">${ASSUMED_CAGR.toFixed(2)}%</div></div>
      <div class="calc-result"><div class="k">Wealth Multiple</div><div class="v">${(fv/invested).toFixed(2)}x</div></div>
      <div class="calc-result"><div class="k">Inflation-Adjusted Value</div><div class="v">${fmtINR(realFv)}</div></div>
    </div>
    <div class="calc-note">Projection assumes the fund's trailing 5Y CAGR of ${ASSUMED_CAGR.toFixed(2)}% continues unchanged and ${INFLATION}% annual inflation — a simplifying assumption, not a return guarantee. Actual SIP XIRR will vary with market timing and sequence of returns.</div>
  </div>`;
}
function setSip(amt, yrs){
  if(amt!==null) sipAmount=amt;
  if(yrs!==null) sipYears=yrs;
  document.getElementById("sip-slot").innerHTML = renderSip();
  document.getElementById("svl-slot").innerHTML = renderSipVsLumpsum();
}

  const winner = lumpFv>sipFv ? "Lumpsum" : "SIP";
  return `

function labSeries(amount, years, ratePct){
  const pts=[];
  for(let y=0;y<=years;y++){ pts.push({y, v: amount*Math.pow(1+ratePct/100,y)}); }

}
function labChartSvg(bear, base, bull){
  const w=580,h=230,padL=46,padR=10,padT=14,padB=26;
  const allV = [...bear,...base,...bull].map(p=>p.v);
  const minV=Math.min(...allV), maxV=Math.max(...allV);
  const years = base.length-1;
  const xFor = y => padL + (y/years)*(w-padL-padR);
  const yFor = v => padT + (1-(v-minV)/(maxV-minV||1))*(h-padT-padB);
  const lineOf = arr => arr.map(p=>`${xFor(p.y)},${yFor(p.v)}`).join(" ");
  const bandPath = `M ${bull.map(p=>`${xFor(p.y)},${yFor(p.v)}`).join(" L ")} L ${[...bear].reverse().map(p=>`${xFor(p.y)},${yFor(p.v)}`).join(" L ")} Z`;
  let grid="";
  for(let g=0;g<4;g++){ const y=padT+g*(h-padT-padB)/3; grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="${T.border}"/>`; }
  const axisLabels = base.filter(p=>p.y%Math.ceil(years/6||1)===0).map(p=>`<text x="${xFor(p.y)}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="${T.greyDim}">Y${p.y}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <defs><linearGradient id="labBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${T.accent}" stop-opacity="0.22"/><stop offset="100%" stop-color="${T.accent}" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${grid}
    <path d="${bandPath}" fill="url(#labBand)"/>
    <polyline points="${lineOf(bull)}" fill="none" stroke="${T.green}" stroke-width="1.4" stroke-dasharray="3 3"/>
    <polyline points="${lineOf(base)}" fill="none" stroke="${T.accent}" stroke-width="2.4"/>
    <polyline points="${lineOf(bear)}" fill="none" stroke="${T.red}" stroke-width="1.4" stroke-dasharray="3 3"/>
    ${axisLabels}
  </svg>`;
}
function renderLab(){
  const amount = 100000;
  const baseRate = ASSUMED_CAGR + RATE_ADJ[labRate] + labDelta;
  const bandWidth = 6.2; // approx one std-dev band, illustrative
  const bull = labSeries(amount, labYears, baseRate+bandWidth);
  const base = labSeries(amount, labYears, baseRate);
  const bear = labSeries(amount, labYears, Math.max(-95,baseRate-bandWidth));
  const fBull = bull[bull.length-1].v, fBase = base[base.length-1].v, fBear = bear[bear.length-1].v;
  return `
  <div class="card">
    ${eyebrow("Future NAV Simulator — What-If Laboratory","activity")}
    <p class="ai-note" style="font-size:13px;color:var(--grey);margin-bottom:16px;">Project ₹1,00,000 forward under different rate regimes. Band = illustrative ±1 std-dev range, not a statistical forecast.</p>
    <div class="lab-scenario-row">
      ${["cut","stable","hike"].map(r=>`<button class="qbtn mono ${labRate===r?'active':''}" onclick="setLabRate('${r}')">Rate ${r==="cut"?"Cut":(r==="stable"?"Stable":"Hike")}</button>`).join("")}
    </div>
    <div class="lab-slider-row">
      <label>Horizon: <span class="lab-slider-val">${labYears} years</span></label>
      <input type="range" min="1" max="15" value="${labYears}" oninput="setLabYears(this.value)"/>
    </div>
    <div class="lab-slider-row">
      <label>Manual Market Adjustment: <span class="lab-slider-val">${labDelta>0?"+":""}${labDelta.toFixed(1)}pp / yr</span></label>
      <input type="range" min="-5" max="5" step="0.5" value="${labDelta}" oninput="setLabDelta(this.value)"/>
    </div>
    ${labChartSvg(bear,base,bull)}
    <div class="calc-results">
      <div class="calc-result"><div class="k">Bear Case (Y${labYears})</div><div class="v" style="color:${T.red}">${fmtINR(fBear)}</div></div>
      <div class="calc-result hi"><div class="k">Base Case (Y${labYears})</div><div class="v">${fmtINR(fBase)}</div></div>
      <div class="calc-result"><div class="k">Bull Case (Y${labYears})</div><div class="v" style="color:${T.green}">${fmtINR(fBull)}</div></div>
    </div>
    <div class="calc-note">Base case = fund's trailing 5Y CAGR (${ASSUMED_CAGR.toFixed(2)}%) adjusted for the selected rate scenario and manual delta. This is a simplified deterministic illustration, not a Monte Carlo forecast or guarantee.</div>
  </div>`;
}
function setLabRate(r){ labRate=r; document.getElementById("lab-slot").innerHTML = renderLab(); }
function setLabYears(y){ labYears=+y; document.getElementById("lab-slot").innerHTML = renderLab(); }
function setLabDelta(d){ labDelta=+d; document.getElementById("lab-slot").innerHTML = renderLab(); }

function renderShockMap(){
  const cards = SHOCK_SCENARIOS.map(s=>{
    const impact = (s.weight/100)*s.shock*s.beta;
    return `<div class="shock-bubble">
      <div class="impact">${impact.toFixed(1)}%</div>
      <div class="nm">${s.name}</div>
      <div style="font-size:11px;color:var(--grey);margin-top:4px;">${s.desc}</div>

    </div>`;
  }).join("");
  return `
  <div class="card flat" style="padding:24px;">
    ${eyebrow("Hidden Risk Detector — What Could Hurt This Portfolio","shield")}

    <div class="shock-grid">${cards}</div>
  </div>`;
}

/* ============================================================
   SECTION: FUND PULSE — living health monitor
============================================================ */
function ecgPath(score){
  const amp = 14 + (score/100)*26;
  let d = "M 0 40 L 40 40";
  for(let i=0;i<6;i++){
    const bx = 40+i*90;
    d += ` L ${bx+10} 40 L ${bx+18} ${40-amp*0.4} L ${bx+26} ${40+amp} L ${bx+34} ${40-amp*1.3} L ${bx+42} 40 L ${bx+90} 40`;
  }
  return d;
}
function renderPulse(){
  const score = computeHealthIndex();
  const color = score>=72?T.green:(score>=50?T.blue:T.red);
  const vitals = [
    {k:"Quality", v:DNA.find(d=>d.key==="Quality").value},
    {k:"Diversification", v:DNA.find(d=>d.key==="Diversification").value},
    {k:"Cash Buffer", v:DNA.find(d=>d.key==="Cash").value},
    {k:"Stability", v:DNA.find(d=>d.key==="Stability").value},
    {k:"Momentum", v:DNA.find(d=>d.key==="Momentum").value},
    {k:"Liquidity", v:DNA.find(d=>d.key==="Liquidity").value}
  ];
  const vitalCards = vitals.map(v=>{
    const c = v.v>=70?T.green:(v.v>=45?T.blue:T.red);
    return `<div class="vital"><div class="k">${v.k}</div><div class="v">${v.v}/100</div><div class="vital-bar"><i style="width:${v.v}%;background:${c};"></i></div></div>`;
  }).join("");
  return `
  <div class="card">
    ${eyebrow("Fund Pulse — The Portfolio's Vital Signs","activity")}
    <div class="pulse-wrap">
      <div class="pulse-score">
        <svg viewBox="0 0 580 80" width="220" height="60">
          <path d="${ecgPath(score)}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="900" stroke-dashoffset="900">
            <animate attributeName="stroke-dashoffset" values="900;0;900" dur="4.5s" repeatCount="indefinite"/>
          </path>
        </svg>
        <div class="num" style="color:${color}">${score}</div>
        <div class="lbl3">Health Index / 100</div>
      </div>
      <div class="vitals-grid">${vitalCards}</div>
    </div>
  </div>`;
}

/* ============================================================
   SECTION: DECISION REPLAY — Portfolio Time Machine
============================================================ */
let replayIndex = 0, replayPlaying = false, replayTimer = null;
function renderReplay(){
  const e = EVOLUTION[replayIndex];
  const fillPct = (replayIndex/(EVOLUTION.length-1))*100;
  const dots = EVOLUTION.map((ev,i)=>`<span class="${i===replayIndex?'active':''}" onclick="scrubReplay(${i})"></span>`).join("");
  const lines = [
    ...e.added.map(a=>`<div class="diff-line diff-add">+ added &nbsp;${a}</div>`),
    ...e.removed.map(a=>`<div class="diff-line diff-rem">− removed &nbsp;${a}</div>`),
    ...e.increased.map(a=>`<div class="diff-line diff-mod">↑ increased &nbsp;${a}</div>`),
    ...e.reduced.map(a=>`<div class="diff-line diff-mod">↓ reduced &nbsp;${a}</div>`)
  ].join("") || `<div class="diff-line" style="color:var(--greyDim)">No material changes this quarter.</div>`;
  return `
  <div class="card" id="replay-inner">
    ${eyebrow("Decision Replay — Portfolio Time Machine","clock")}
    <div class="replay-controls">
      <button class="replay-play" onclick="toggleReplayPlay()">${icon(replayPlaying?"minus":"activity",14,T.accent)}</button>
      <div class="replay-track"><div class="replay-fill" style="width:${fillPct}%"></div><div class="replay-dots">${dots}</div></div>
      <span class="mono" style="font-size:12px;color:var(--grey);min-width:60px;text-align:right;">${e.q}</span>
    </div>
    <div class="evo-headline" style="margin-bottom:6px;">${e.headline}</div>
    <div class="evo-change" style="margin-bottom:14px;">${e.change}</div>
    <div class="replay-diff">${lines}</div>
    <div class="evo-ai" style="margin-top:12px;">${icon("sparkles",12,T.accent)}<span>${e.ai}</span></div>
  </div>`;
}
function scrubReplay(i){ replayIndex=i; document.getElementById("replay-slot").innerHTML = renderReplay(); }
function toggleReplayPlay(){
  replayPlaying = !replayPlaying;
  if(replayPlaying){
    replayTimer = setInterval(()=>{
      replayIndex = (replayIndex+1)%EVOLUTION.length;
      document.getElementById("replay-slot").innerHTML = renderReplay();
    }, 1700);
  } else {
    clearInterval(replayTimer);
  }
  document.getElementById("replay-slot").innerHTML = renderReplay();
}

/* ============================================================
   SECTION: RESEARCH COPILOT (live AI, grounded in fund context)
============================================================ */
const COPILOT_SUGGESTIONS = [
  "Why is this fund overweight Banking?",
  "Can this fund beat its benchmark next cycle?",
  "Where is the hidden alpha in this portfolio?",
  "What's the single biggest risk here?",
  "Is this fund better than ICICI Prudential Bluechip?"
];
const FUND_CONTEXT = JSON.stringify({
  fund: FUND, sectors: SECTORS.slice(0,10), topHoldings: TOP_HOLDINGS.slice(0,12),
  exclusiveHoldings: EXCLUSIVE_HOLDINGS.map(h=>({name:h.name, weight:h.weight, why:h.why})),
  returns: RETURNS, riskStats: STATS,
  peerFunds: PEER_FUNDS.map(f=>({name:f.name, aum:f.aum, ter:f.ter, cagr5:f.cagr5, sharpe:f.sharpe, alpha:f.alpha})),
  categoryRank: CATEGORY_RANK, summary: SUMMARY.brief
});
let copilotHistory = [];
let copilotBusy = false;
function renderCopilotLog(typing){
  const log = document.getElementById("copilot-log");
  if(!log) return;
  const msgs = copilotHistory.map(m=>`<div class="copilot-msg ${m.role==='user'?'user':'ai'}">${m.role==='user'?esc(m.content):m.content}</div>`).join("");
  const typingHtml = typing ? `<div class="copilot-msg ai"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>` : "";
  log.innerHTML = msgs + typingHtml || `<div style="color:var(--greyDim);font-size:12.5px;">Ask anything about this fund — I'll answer from its live positioning data.</div>`;
  log.scrollTop = log.scrollHeight;
}
async function sendCopilot(text){
  if(!text || !text.trim() || copilotBusy) return;
  copilotBusy = true;
  copilotHistory.push({role:"user", content:text.trim()});
  renderCopilotLog(true);
  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:1000,
        system:"You are the Research Copilot embedded in an institutional terminal for the Mirae Asset Large Cap Fund. Answer ONLY from the JSON fund context provided; be concise (under 130 words), specific with numbers, and analytical, not promotional. If the context can't answer something, say so plainly rather than guessing.\n\nFUND CONTEXT:\n"+FUND_CONTEXT,
        messages: copilotHistory.map(m=>({role:m.role, content:m.content}))
      })
    });
    const data = await resp.json();
    const out = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim() || "I couldn't generate a response — please try again.";
    copilotHistory.push({role:"assistant", content:out});
  }catch(e){
    copilotHistory.push({role:"assistant", content:"⚠️ Copilot is temporarily unavailable. Please try again in a moment."});
  }
  copilotBusy = false;
  renderCopilotLog(false);
}
function handleCopilotSend(){
  const inp = document.getElementById("copilot-input");
  const val = inp.value; inp.value="";
  sendCopilot(val);
}
function handleCopilotKey(ev){ if(ev.key==="Enter") handleCopilotSend(); }
function askCopilot(q){ sendCopilot(q); }
function renderCopilot(){
  return `
  <div class="card flat" style="padding:24px;">
    ${eyebrow("Research Copilot","sparkles")}
    <p class="ai-note" style="font-size:13px;color:var(--grey);margin-bottom:14px;">A live AI analyst grounded in this terminal's fund, sector, holdings, peer and risk data — not a generic chatbot.</p>
    <div class="copilot-chips">${COPILOT_SUGGESTIONS.map(q=>`<div class="copilot-chip" onclick="askCopilot('${q.replace(/'/g,"\\'")}')">${q}</div>`).join("")}</div>
    <div class="copilot-log" id="copilot-log"><div style="color:var(--greyDim);font-size:12.5px;">Ask anything about this fund — I'll answer from its live positioning data.</div></div>
    <div class="copilot-input-row">
      <input id="copilot-input" type="text" placeholder="Ask the copilot about this fund…" onkeydown="handleCopilotKey(event)"/>
      <button class="copilot-send" onclick="handleCopilotSend()">Ask</button>
    </div>
  </div>`;
}

    <div class="footer-note">
      Illustrative institutional research terminal built around Mirae Asset Large Cap Fund. AUM, expense ratio, and
      trailing CAGR for this fund and its 9 large-cap peers are compiled from public factsheets and fund trackers
      (regular-plan basis, approximate, as of Apr–Jul 2026). Risk-statistic columns beyond AUM/TER/CAGR (Sharpe,
      Sortino, alpha, beta, active share, exclusive-holdings conviction scores, rolling-return distributions,
      overlap percentages, category percentiles) — and the newer Fund Brain, Conviction Galaxy, Capital Flow River,

      Lab projections use the fund's own trailing 5Y CAGR as a simplifying assumption — not a return guarantee, and
      the What-If Lab's bear/bull band is an illustrative ±1 std-dev spread, not a statistical forecast. The

  `;
  requestAnimationFrame(()=>{
    animateDNA();
    animateMirror();

    // count-up AUM / NAV
    countUp(".kpi:nth-child(1) .v", FUND.aum, v=>fmtINR(v)+" Cr");
    countUp(".kpi:nth-child(3) .v", FUND.nav, v=>"₹"+v.toFixed(2));

function countUp(selector, target, formatter){
  const els = document.querySelectorAll(".kpi .v");
  // fallback simple approach: animate first (AUM) and third (NAV) kpi directly by index
}

// Simpler count-up: animate AUM and NAV kpi cells directly by index after render
function animateKpis(){
  const kpiEls = document.querySelectorAll(".kpi .v");
  if(kpiEls.length < 3) return;
  const aumEl = kpiEls[0], navEl = kpiEls[2];
  let start = null;
  const dur = 1000;
  function step(t){
    if(!start) start = t;
    const p = Math.min((t-start)/dur, 1);
    const eased = 1 - Math.pow(1-p, 3);
    aumEl.textContent = fmtINR(FUND.aum*eased) + " Cr";
    navEl.textContent = "₹" + (FUND.nav*eased).toFixed(2);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

render();
animateKpis();
</script>
